version: "3.9"

services:
  postgis:
    image: postgis/postgis:15-3.4
    container_name: tokyo_postgis
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tokyo_osm
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data:/data

  osm2pgsql:
    image: iboates/osm2pgsql
    container_name: tokyo_osm_import
    depends_on:
      - postgis
    environment:
      PGPASSWORD: postgres  
    volumes:
      - ./data:/data
    entrypoint: >
      osm2pgsql
      -H postgis
      -U postgres
      -d tokyo_osm
      --create
      --slim
      --hstore
      /data/kanto-latest.osm.pbf

volumes:
  pgdata: